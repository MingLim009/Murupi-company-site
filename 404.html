<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Murupi Produções</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/img/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .error-page{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;background:var(--charcoal);color:var(--cream);padding:40px 24px;
  }
  .error-page__code{font-family:var(--font-jumbo);font-size:clamp(5rem,18vw,11rem);color:var(--gold);margin:0;line-height:.9}
  .error-page h1{margin-top:.2em}
  .error-page p{color:var(--cream-dim);max-width:44ch}
  .error-page .logo{margin-bottom:48px;display:inline-block}
</style>
</head>
<body>
  <div class="error-page">
    <a href="/" class="logo" aria-label="Murupi Produções — início">
      <img src="assets/img/brand/logo.svg" alt="Murupi Produções" width="150" height="47">
    </a>
    <p class="error-page__code">404</p>
    <h1>Essa página não existe.</h1>
    <p>O link pode ter mudado ou o endereço foi digitado errado. Volte para a página inicial para encontrar o que procura.</p>
    <a href="/" class="btn btn--primary" style="margin-top:24px">Voltar ao início <span class="btn__arrow">&rarr;</span></a>
  </div>
</body>
</html>
